<style>
:root{
  --bg:#DCEBE3;--paper:#FFFFFF;--ink:#12241C;--sub:#3C5249;--line:#9DB8AB;
  --green:#00623A;--on-green:#FFFFFF;--red:#B8121B;--on-red:#FFFFFF;--yellow:#FFD23F;--soft:#EEF6F1;
  --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
  --kai:'LXGW WenKai TC','BiauKai','DFKai-SB','標楷體',var(--sans);
  --serif:'Noto Serif TC','PMingLiU','Songti TC',serif;
  --mq:0px;
}
:root[data-theme="contrast"]{--bg:#000;--paper:#000;--ink:#FFF;--sub:#FFE66D;--line:#FFF;--green:#FFD23F;--on-green:#000;--red:#FF9C94;--on-red:#000;--soft:#1C1C1C}
html{font-size:22px}
html[data-fs="1"]{font-size:25px}
html[data-fs="2"]{font-size:28px}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:500;line-height:1.6;padding-top:var(--mq);-webkit-text-size-adjust:100%}
body.has-marquee{--mq:34px}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--green);overflow-wrap:anywhere}
:focus-visible{outline:4px solid var(--yellow);outline-offset:2px;box-shadow:0 0 0 7px var(--ink)}

#marqueeBar{position:fixed;top:0;left:0;right:0;height:34px;background:var(--green);z-index:60;overflow:hidden;display:none;align-items:center}
#marqueeBar.show{display:flex}
#marqueeTrack{display:inline-block;white-space:nowrap;padding-left:100%;font-size:16px;font-weight:700;color:var(--on-green);animation:marquee-scroll 30s linear infinite}
#marqueeBar:hover #marqueeTrack{animation-play-state:paused}
@keyframes marquee-scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

.top{display:flex;align-items:center;gap:.4rem;max-width:640px;margin:0 auto;padding:.5rem 16px}
.top{flex-wrap:wrap}
.brand{flex:1 1 4.6em;min-width:0;font-family:var(--serif);font-weight:900;font-size:1.05rem;line-height:1.25}
.tbtn{flex:none;min-height:2.5rem;padding:.2rem .6rem;border:2px solid var(--green);border-radius:.6rem;background:var(--paper);color:var(--green);font-weight:700;font-size:.82rem;cursor:pointer}
main{max-width:640px;margin:0 auto;padding:0 16px calc(6rem + env(safe-area-inset-bottom))}
body.focus main{padding-bottom:calc(6.5rem + env(safe-area-inset-bottom))}
h2{font-family:var(--serif);font-weight:900;font-size:1.5rem;line-height:1.35;margin:.4rem 0 .7rem}
p{margin:.4rem 0}
.muted{color:var(--sub)}
.coach{font-family:var(--kai);font-size:1.3rem;line-height:1.6}

/* 大按鈕 */
.btn{display:flex;align-items:center;justify-content:center;gap:.4rem;width:100%;min-height:3.3rem;padding:.5rem 1rem;border:3px solid var(--green);border-radius:.8rem;background:var(--paper);color:var(--green);font-weight:700;font-size:1.05rem;line-height:1.3;cursor:pointer;text-decoration:none;text-align:center}
.btn.main{background:var(--green);color:var(--on-green);font-size:1.2rem;min-height:3.8rem}
.btn.red{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn:active{transform:translateY(2px)}
.btn+.btn{margin-top:.6rem}
.btn.text{border:0;background:none;text-decoration:underline;min-height:2.8rem}

/* 下方三個大按鈕 */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;background:var(--paper);border-top:3px solid var(--green);padding-bottom:env(safe-area-inset-bottom)}
#nav button{flex:1;max-width:214px;min-height:4.2rem;padding:.3rem .1rem;border:0;background:none;color:var(--ink);font-weight:700;font-size:1rem;line-height:1.2;cursor:pointer}
#nav button span{display:block;font-size:1.45rem;line-height:1.2}
#nav button[aria-current="page"]{background:var(--green);color:var(--on-green)}
body.focus #nav{display:none}

/* 撕日曆 */
.calwrap{position:relative;margin:.3rem 0 1rem}
.cal{position:relative;background:var(--paper);border:2px solid var(--ink);border-radius:.3rem;overflow:hidden;box-shadow:0 4px 0 -1px var(--paper),0 4px 0 1px var(--ink),0 8px 0 -1px var(--paper),0 8px 0 1px var(--ink)}
.cal-head{display:flex;justify-content:space-between;gap:.5rem;background:var(--red);color:var(--on-red);padding:1rem .8rem .3rem;font-weight:700;font-size:.95rem;position:relative}
.cal-head::before{content:'';position:absolute;top:.3rem;left:0;right:0;height:.42rem;background:radial-gradient(circle at center,var(--bg) .2rem,transparent .22rem) 0 0/33.34% 100% repeat-x}
.cal-num{text-align:center;font-family:var(--serif);font-weight:900;font-size:7.4rem;line-height:1.08;color:var(--green);letter-spacing:-.02em}
.cal-num.holiday{color:var(--red)}
.cal-week{display:flex;justify-content:center;gap:0 .8rem;flex-wrap:wrap;line-height:1.35;font-weight:700;font-size:1.05rem;padding:0 .8rem}
.cal-yj{display:grid;grid-template-columns:1fr 1fr;margin:.6rem .8rem 0;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);font-family:var(--kai);font-size:1rem;line-height:1.35}
.cal-yj div{padding:.35rem .3rem;display:flex;gap:.35rem}
.cal-yj div+div{border-left:2px solid var(--ink)}
.cal-yj b{font-size:1.25rem;line-height:1.1;flex:none}
.cal-yj .yi b{color:var(--green)}.cal-yj .ji b{color:var(--red)}
.cal-body{padding:.7rem .8rem .9rem}
.cal-body .lab{font-weight:700;color:var(--sub);font-size:.9rem;margin:0}
.cal-body .ttl{font-family:var(--serif);font-weight:900;font-size:1.5rem;line-height:1.3;margin:.05rem 0 .6rem}
.tear{position:absolute;inset:0;z-index:5;transform-origin:15% 0;animation:tear .95s cubic-bezier(.5,0,.8,.4) forwards;pointer-events:none}
@keyframes tear{0%{transform:none;opacity:1}25%{transform:rotate(-4deg)}100%{transform:translate(-14%,120%) rotate(-24deg);opacity:0}}

/* 印章 */
.stamp{display:inline-flex;align-items:center;justify-content:center;flex-direction:column;width:7.2rem;height:7.2rem;border:.28rem solid var(--red);border-radius:50%;color:var(--red);font-family:var(--kai);font-weight:700;font-size:1.5rem;line-height:1.15;transform:rotate(-9deg);box-shadow:inset 0 0 0 .1rem var(--paper),inset 0 0 0 .2rem var(--red);background:var(--paper)}
.stamp small{font-size:.8rem;font-family:var(--sans)}
.thump{animation:thump .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes thump{from{transform:scale(2.4) rotate(6deg);opacity:0}to{transform:scale(1) rotate(-9deg);opacity:1}}
.center{text-align:center}
.book{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.45rem;margin:.5rem 0 .9rem}
.cell{position:relative;min-height:6.2rem;padding:.35rem;border:2px solid var(--line);border-radius:.5rem;background:var(--paper);color:var(--ink);font-size:.82rem;font-weight:700;line-height:1.3;cursor:pointer;text-align:left;overflow:hidden}
.cell.next{border:3px solid var(--green)}
.cell.done::after{content:'學會了';position:absolute;right:.2rem;bottom:.2rem;width:3.1rem;height:3.1rem;display:flex;align-items:center;justify-content:center;border:.15rem solid var(--red);border-radius:50%;color:var(--red);font-family:var(--kai);font-size:.68rem;transform:rotate(-9deg);background:var(--paper)}
.unit{font-weight:900;margin:.8rem 0 0}

/* 卡片、對話 */
.card{background:var(--paper);border:2px solid var(--line);border-radius:.8rem;padding:.8rem;margin:.7rem 0}
.bub{padding:.55rem .75rem;border-radius:.8rem;margin:.4rem 0;white-space:pre-line}
.bub.me{background:var(--soft);border:2px solid var(--line)}
.bub.ai{background:var(--paper);border:2px solid var(--green)}
.bub small{display:block;font-weight:700;color:var(--sub);font-size:.8rem}
.steps{list-style:none;margin:.4rem 0;padding:0;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:.35rem 0 .6rem 2.6rem;font-size:1.15rem;line-height:1.5}
.steps li::before{content:counter(s);position:absolute;left:0;top:.3rem;width:2rem;height:2rem;border-radius:50%;background:var(--green);color:var(--on-green);font-weight:900;display:flex;align-items:center;justify-content:center}
.ans{margin-top:.7rem;padding:.6rem .8rem;border-radius:.8rem;border:3px solid var(--green);background:var(--soft);font-size:1.1rem}
.ans.no{border-color:var(--red)}
.ans b{display:block;font-size:1.2rem}
.pick.right{background:var(--green);color:var(--on-green)}
.pick.wrong{border-color:var(--red);color:var(--red)}
textarea,input[type=text],input[type=password],select{width:100%;min-height:3rem;padding:.5rem .6rem;border:3px solid var(--green);border-radius:.6rem;background:var(--paper);font-size:1.1rem}
textarea{min-height:5rem;resize:vertical}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.6rem;margin-top:.6rem}
.row2 .btn+.btn{margin-top:0}
.row2 .btn{padding-left:.3rem;padding-right:.3rem}
.lessonbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--paper);border-top:3px solid var(--green);padding:.5rem 16px calc(.5rem + env(safe-area-inset-bottom))}
.lessonbar .in{max-width:608px;margin:0 auto;display:grid;grid-template-columns:auto minmax(0,1fr);gap:.5rem}
.lessonbar .in.one{grid-template-columns:minmax(0,1fr)}
.lessonbar .btn{margin:0;white-space:nowrap;padding:.5rem .7rem}
.ans+.btn{margin-top:.7rem}
.pg{font-weight:700;color:var(--sub);margin:.3rem 0 0}
.msg{background:var(--paper);border:3px solid var(--ink);border-radius:.8rem;padding:.7rem .8rem;margin:.6rem 0;font-size:1.2rem;line-height:1.5}
.msg small{display:block;font-weight:700;color:var(--sub);font-size:.85rem;margin-bottom:.2rem}

/* 常用設定 */
.set-sec{border:2px solid var(--line);border-radius:.7rem;margin-bottom:.5rem;background:var(--paper)}
.set-sec>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;padding:.6rem .7rem;font-weight:700;min-height:3rem}
.set-sec>summary::-webkit-details-marker{display:none}
.set-sec>summary::after{content:'▸';margin-left:.2rem;transition:transform .2s;flex:none}
.set-sec[open]>summary::after{transform:rotate(90deg)}
.set-sec .sst{flex:1 1 0;min-width:0}
.set-sec .ssv{font-weight:500;font-size:.8rem;color:var(--sub);text-align:right}
.set-in{padding:0 .7rem .8rem}
.set-in label{display:block;font-weight:700;margin:.5rem 0 .2rem}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:.4rem}
.seg button{min-width:0;overflow-wrap:anywhere;min-height:3rem;padding:.2rem;border:3px solid var(--green);border-radius:.6rem;background:var(--paper);color:var(--green);font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--green);color:var(--on-green)}

.foot{margin-top:1.6rem;padding-top:.8rem;border-top:2px solid var(--line);font-size:.9rem;color:var(--sub)}
.foot .row{display:flex;flex-wrap:wrap;gap:.3rem .9rem;align-items:center;margin:.4rem 0}
.foot button,.foot a{background:none;border:0;padding:.3rem 0;color:var(--green);font-weight:700;text-decoration:underline;cursor:pointer;font-size:.95rem}
#toast{position:fixed;left:16px;right:16px;bottom:6.2rem;z-index:90;max-width:520px;margin:0 auto;padding:.7rem 1rem;border-radius:.7rem;background:var(--ink);color:var(--bg);font-weight:700;text-align:center;display:none}
#toast.show{display:block}

.modal{position:fixed;inset:0;z-index:80;display:none;background:rgba(10,25,18,.7);padding:16px;overflow:auto}
.modal.show{display:block}
.modal .box{max-width:600px;margin:calc(var(--mq) + .3rem) auto;background:var(--paper);border:3px solid var(--ink);border-radius:.9rem;padding:1rem}
.modal h2{margin-top:0}
.modal ul{margin:.3rem 0 .8rem;padding-left:1.2rem}
.modal li{margin:.35rem 0}
.steps{list-style:none;margin:.5rem 0 .9rem;padding:0;counter-reset:s}
.steps li{counter-increment:s;position:relative;min-height:1.9rem;margin:.55rem 0;padding-left:2.5rem;font-weight:700}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;display:flex;align-items:center;justify-content:center;width:1.9rem;height:1.9rem;border-radius:50%;background:var(--green);color:var(--on-green)}
.inst-act{position:sticky;bottom:-16px;margin:0 -1rem -1rem;padding:.5rem 1rem calc(.2rem + 16px);background:var(--paper);border-top:2px solid var(--line);border-radius:0 0 .7rem .7rem}
.inst-act .row2 .btn{margin:0;white-space:nowrap;font-size:.9rem}
.steps .ic{width:1.35em;height:1.35em;vertical-align:-.28em;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.creator{background:var(--soft);border-radius:.6rem;padding:.6rem .7rem;font-size:.85rem;line-height:1.55;margin-bottom:.7rem}
html[data-fs="1"] .cal-num,html[data-fs="2"] .cal-num{font-size:4.8rem}
html[data-fs="1"] .brand,html[data-fs="2"] .brand{flex-basis:100%}
html[data-fs="1"] .top .tbtn,html[data-fs="2"] .top .tbtn{flex:1}
html[data-fs="1"] .greet,html[data-fs="2"] .greet,html[data-fs="2"] .cal-yj{display:none}
@media (prefers-reduced-motion:reduce){.tear,.thump{animation:none}.tear{display:none}}
@media (max-width:380px){.cal-num{font-size:6.2rem}.book{grid-template-columns:repeat(2,minmax(0,1fr))}.brand{font-size:.95rem}}
</style>
</head>

var PREFIX = 'alc.', KEY = PREFIX + 'state', SET_KEY = PREFIX + 'settings', API_KEY = PREFIX + 'api', FOLD_KEY = PREFIX + 'fold', WARN_KEY = PREFIX + 'warnSeen';

/* ---------- 日期 ---------- */
function ymd(d){ d = d || new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function addDays(d, n){ var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; }
var MON = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'], WK = '日一二三四五六';
function lunar(d){ try{ var p = new Intl.DateTimeFormat('zh-TW-u-ca-chinese', {month:'long', day:'numeric'}).formatToParts(d), m = '', n = ''; p.forEach(function(x){ if(x.type === 'month') m = x.value; if(x.type === 'day') n = x.value; }); return /^\d+$/.test(n) ? '農曆' + m + cnDay(+n) : '農曆' + m + n; }catch(e){ return ''; } }
function cnDay(n){ var a = '一二三四五六七八九十'; if(n <= 10) return '初' + a[n - 1]; if(n < 20) return '十' + a[n - 11]; if(n === 20) return '二十'; if(n < 30) return '廿' + a[n - 21]; return '三十'; }

    }
  } else {
    if(SC.i < D.scenes.length){

    } else {

    }

  on('prac', function(){ SC = {mode:'prac', i:0, ans:null, score:0}; vScam(); window.scrollTo(0, 0); });
  on('back', function(){ SC = null; vScam(); window.scrollTo(0, 0); });

/* ---------- 跑馬燈（必備，不可關閉） ---------- */
function initMarquee(){
  var URL_ = "https://script.google.com/macros/s/AKfycbwKX0DNNbY8y4nf90BFTHtxgfqJcHHcZasRrgycl4QAe52_hkjMWSkYk4xOsqU-JPCROw/exec";
  var MK = PREFIX + 'marquee', REFRESH = 20 * 60 * 1000, bar = $('marqueeBar'), track = $('marqueeTrack'), lastKey = null;
  function loadCache(){ try{ return JSON.parse(lsGet(MK) || '[]'); }catch(e){ return []; } }
  function appendText(c, text){ var re = /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, li = 0, m; while((m = re.exec(text))){ if(m.index > li) c.appendChild(document.createTextNode(text.slice(li, m.index))); var a = document.createElement('a'); a.href = m[2]; a.textContent = m[1]; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.style.color = 'inherit'; a.style.textDecoration = 'underline'; c.appendChild(a); li = re.lastIndex; } if(li < text.length) c.appendChild(document.createTextNode(text.slice(li))); }
  function renderM(items){
    if(!items || !items.length) return;
    var k = JSON.stringify(items); if(k === lastKey) return; lastKey = k; track.innerHTML = '';
    var fr = document.createDocumentFragment();
    function pass(){ items.forEach(function(it, i){ if(i > 0) fr.appendChild(document.createTextNode('　★　')); appendText(fr, String(it)); }); }
    pass(); fr.appendChild(document.createTextNode('　★　')); pass(); track.appendChild(fr);
    bar.classList.add('show'); document.body.classList.add('has-marquee');
    track.style.animationDuration = Math.max(track.scrollWidth / 2 / 60, 12) + 's';
  }
  function fetchM(){ fetch(URL_, {method:'POST', body:JSON.stringify({serial:''})}).then(function(r){ return r.json(); }).then(function(d){ if(d && Array.isArray(d.marquee) && d.marquee.length){ lsSet(MK, JSON.stringify(d.marquee)); renderM(d.marquee); } }).catch(function(){}); }
  renderM(loadCache()); fetchM(); setInterval(fetchM, REFRESH);
}
